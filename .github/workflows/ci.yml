name: AlphaEdge CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  safety:
    name: Safety Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Paper trading guard
        run: |
          if git ls-files '*.py' '*.yaml' '*.yml' '*.env' '*.cfg' | grep -v ".github/workflows/ci.yml" | xargs grep -l "ALPHAEDGE_PAPER=false" 2>/dev/null; then
            echo "❌ ALPHAEDGE_PAPER=false found in committed files — BLOCKED"
            exit 1
          fi
          echo "✅ Paper trading guard passed"

      - name: No .env credentials guard
        run: |
          if git ls-files | grep -q "^\.env$"; then
            echo "❌ .env file committed — credentials leak risk — BLOCKED"
            exit 1
          fi
          echo "✅ No .env credentials committed"

      - name: No type-ignore guard
        run: |
          if grep -rn "# type: ignore" --include="*.py" alphaedge/ 2>/dev/null; then
            echo "❌ # type: ignore found — fix the root cause — BLOCKED"
            exit 1
          fi
          echo "✅ No type: ignore shortcuts found"

      - name: Secret scanning (TruffleHog)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  qa:
    name: QA (Python 3.11.9)
    needs: safety
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint + Format check (Ruff)
        run: |
          python -m ruff check alphaedge/
          python -m ruff format --check alphaedge/

      - name: Type checking (Pyright)
        run: python -m pyright alphaedge/

      - name: Build Cython extensions
        run: python setup.py build_ext --inplace

      # Verify all 5 compiled modules import cleanly after build
      - name: Compiled core smoke check
        env:
          ALPHAEDGE_CORE_BACKEND: compiled
        run: python scripts/ci_smoke_check.py

      - name: Tests + Coverage (Pytest)
        env:
          ALPHAEDGE_CORE_BACKEND: stubs
        run: |
          python -m pytest alphaedge/tests/ \
            --tb=short \
            --cov=alphaedge \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
