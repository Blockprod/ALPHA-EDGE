name: AlphaEdge CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint + Format check (Ruff)
        run: |
          python -m ruff check alphaedge/ --config pyproject.toml
          python -m ruff format --check alphaedge/

      - name: Type checking (Pyright / Pylance)
        run: |
          python -m pyright alphaedge/

      - name: Build Cython extensions
        run: |
          python setup.py build_ext --inplace

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.event.after }}
          extra_args: --only-verified

      - name: Compiled core smoke check
        env:
          ALPHAEDGE_CORE_BACKEND: compiled
        run: |
          python -c "from alphaedge.core import engulfing_detector, fcr_detector, gap_detector, order_manager, risk_manager; print(engulfing_detector.__name__); print(fcr_detector.__name__); print(gap_detector.__name__); print(order_manager.__name__); print(risk_manager.__name__)"

      - name: Tests (Pytest)
        env:
          ALPHAEDGE_CORE_BACKEND: stubs
        run: |
          python -m pytest alphaedge/tests/ -v --tb=short \
            --cov=alphaedge \
            --cov-report=term-missing \
            --cov-fail-under=80
