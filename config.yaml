# --- Log Level ---
log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR

# --- Interactive Brokers Gateway ---
ib:
  host: "127.0.0.1"
  port: 4002               # 4001 = live, 4002 = paper
  client_id: 2             # EDGECORE uses 1 — must differ to avoid IB disconnect
  account_id: ""            # Set in .env (ALPHAEDGE_IB_ACCOUNT)
  account_type: "Individual"  # Individual or Financial Advisor
  gateway_path: ""              # Set in .env (ALPHAEDGE_IB_GATEWAY_PATH) or here
  launcher_path: ""             # Optional external launcher (ex: StartIBC.bat)
  login_mode: "manual"          # manual | stored | ibc

# --- Trading Parameters ---
trading:
  # Currency pairs to monitor
  # C-ST-06 (2026-04-02): GBPUSD excluded — comparative backtest (Option A vs Option B) shows
  # Option B (exclude GBPUSD) dominates: PF 1.5988 vs 1.3001, Sharpe 3.74 vs 2.38.
  # GBPUSD PF=1.09 at gate ADX≥32; structural noise, not edge. See reports/report_gbpusd_optimization_2026-04-02.csv
  pairs:
    - "EURUSD"
    # - "GBPUSD"  # Excluded 2026-04-02: PF=1.09, Sharpe drag. Option B wins: +22.9% PF, +57.5% Sharpe
    - "USDJPY"   # WR=49.5%, PF=1.64 — best signal
    # - "USDCHF"  # WR=47%, PF=1.70 — IS/OOS gap 33.3% — excluded 2026-04-01
    # - "GBPJPY"  # 0 trades — carry filter blocks all signals 2026-04-01
    # - "AUDUSD"  # WR=39.6%, PF=1.14 — no edge; IS/OOS gap 35.2% — excluded 2026-04-01
    # - "NZDUSD"  # 0 trades LONG-only — untested bidirectional

  # Risk per trade as % of account equity
  # 1.0% = 2% global risk / 2 pairs (EURUSD + USDJPY) — fallback for pairs not in risk_pct_by_pair
  risk_pct: 1.0

  # Per-pair risk override (empty = use global risk_pct for all pairs)
  # EURUSD: 0.80% — PF=1.84, $46.3/trade — best efficiency
  # USDJPY: 0.70% — PF=1.44, WR=49.5%
  # Total global risk: 0.80+0.70 = 1.50% (2-pair portfolio, measured Option B)
  risk_pct_by_pair:
    EURUSD: 0.80
    # GBPUSD: 0.50  # Excluded 2026-04-02 — C-ST-06 Option B
    USDJPY: 0.70   # PLAFONNÉ — BOJ policy risk 2025-2026. Voir lessons.md [2026-05-27].

  # ATR-scaling reference pips by pair (empty dict = ATR-scaling disabled)
  # risk_pct_eff = risk_pct * min(1.0, max(0.5, ATR_ref / ATR_current))
  # When ATR_current > ATR_ref: risk is reduced (up to 50% minimum)
  # ATR-scaling désactivé (coût −16% P&L pour −0.89pp OOS DD — ratio défavorable)
  atr_ref_pips_by_pair: {}

  # Maximum daily loss before auto-shutdown (% of equity)
  max_daily_loss_pct: 3.0

  # Maximum trades per session
  max_trades_per_session: 6

  # Maximum trades per calendar day per pair (jackpot guard — prevents over-concentration)
  max_trades_per_day: 3

  # Days of week to exclude (0=Monday, 4=Friday, 6=Sunday)
  # Tested [0, 4] → 42T WR=47.6%, Sharpe=2.23 vs baseline 69T WR=54.5%, Sharpe=3.37 — ELIMINATED
  excluded_days: []  # LOCKED: no day exclusion optimal

  # USD correlation filter: block 2nd trade when it amplifies same-direction USD exposure
  # Tested: 26T WR=46.2%, Sharpe=1.94 vs baseline 69T WR=54.5%, Sharpe=3.37 — ELIMINATED
  # (blocked 49/69 trades — sessions are structurally independent, not USD-correlated)
  usd_correlation_filter: false

  # Direction filter: "ALL" | "LONG" | "SHORT" — filter trade direction
  # Re-enabled "ALL" 2026-04-01: LONG-only was blocking USD-strength SHORT signals (2024-2025).
  # Original LOCK was based on N=4 paper trades — statistically meaningless.
  # EMA crossover with ADX=30 gate is symmetric: SHORT fires when ema_fast < ema_slow (downtrend).
  # Monitor: if SHORT WR < 35% over ≥30 live trades, revert to LONG.
  direction_filter: "ALL"

  # Walk-forward rolling validation — 6-12 windows glissantes sur 3 ans
  # train=18m + test=3m + step=3m → 7 fenêtres OOS non-chevauchantes
  walk_forward_enabled: true
  walk_forward_train_months: 18
  walk_forward_test_months: 3
  walk_forward_step_months: 3

  # ML signal filter — logistic regression on 5 features (ADX, EMA delta, carry diff, ATR ratio, weekday)
  # Walk-forward inline training: model retrained after each realized trade (min_samples required)
  # Set ml_filter_enabled: true to activate; compare OOS Sharpe vs baseline (2.59)
  ml_filter_enabled: false   # OFF — set to true to enable walk-forward ML gating
  ml_filter_min_samples: 30  # Minimum trades before model starts filtering

  # C-ST-06 GBPUSD optimization gate.
  # 0.0 = gate disabled. GBPUSD excluded from portfolio (Option B) — gate is irrelevant.
  # Was 32.0 when testing Option A; set to 0.0 since GBPUSD not in pairs (2026-04-02).
  gbpusd_long_adx_min: 0.0

  # Pair-level profitability references used for audit tracking and future sweeps.
  pair_min_pf_threshold:
    EURUSD: 1.5
    # GBPUSD: 1.2  # Excluded 2026-04-02 — C-ST-06 Option B
    USDJPY: 1.5

  # Maximum acceptable spread in pips (skip trade if exceeded)
  max_spread_pips: 2.0

  # Safety cap on position size — dynamic sizing cannot exceed this value.
  # 1000 micro lots = 10 standard lots; covers EURUSD 3%-risk sizing on a $10k
  # account (909 lots needed for 3.3-pip SL at $0.10/pip/micro-lot).
  max_lot_size: 1000.0

  # Spread spike multiplier (spread > N× max → WARNING during open position)
  spread_spike_multiplier: 3.0

  # Lot type: standard (100k), mini (10k), micro (1k)
  lot_type: "micro"

  # NYSE session window (Eastern Time — DST auto-handled)
  session_start: "09:30"
  session_end: "10:30"

  # Action at session end if position still open: "hold" or "close"
  session_end_action: "hold"

  # Monitoring window (UTC) — swing strategy checks signals during this window
  monitoring_window_start: "08:00"
  monitoring_window_end: "18:00"

  # Signal timeframes for Momentum+Carry swing strategy
  signal_timeframe: "1 day"    # Primary timeframe for momentum detection
  confirmation_timeframe: "4 hours"  # Secondary confirmation timeframe

  # Number of years of historical data to fetch for backtesting
  backtest_years: 3

  # EUR/USD rate for PnL conversion in backtest reports (update as needed)
  eur_usd_rate: 1.08

  # Starting equity for live strategy virtual capital and backtest metrics (USD)
  starting_equity: 1000.0

# --- Momentum Signal Parameters ---
momentum:
  fast_period: 12        # EMA fast period
  slow_period: 26        # EMA slow period
  adx_period: 14         # ADX smoothing period
  adx_threshold: 32.0    # GELÉ 2026-05-27 — voir tasks/lessons.md [2026-05-27]. Raised: 25→30 (2026-04-01), 30→32 (2026-04-14). Ne pas modifier sans N≥30 trades OOS paper nouveaux.
  lookback_days: 252     # Historical bars for signal computation

# --- Carry Signal Parameters ---
carry:
  min_differential_pct: 0.5  # Minimum rate differential to declare a bias (%)
  enabled: true               # Active: carry filter aligns momentum direction with interest-rate differential bias
  # carry_rates_source controls where live carry rates are loaded from at runtime.
  # "static"  — use rates defined in this file (default; no hot-reload)
  # "file"    — reload from data/carry_rates.json on every session start
  carry_rates_source: "file"
  # ISO-8601 date when carry_rates were last verified against CB publications.
  # Staleness warning logged at session start if >30 days old.
  carry_rates_updated: "2026-03-01"
  rates:
    EUR: 3.65   # ECB deposit facility rate (2026-Q1)
    USD: 5.25   # Fed funds rate upper bound (2026-Q1)
    JPY: 0.10   # BOJ overnight rate (2026-Q1)
    GBP: 5.25   # BOE base rate (2026-Q1)
    AUD: 4.35   # RBA cash rate (2026-Q1)
    NZD: 5.50   # RBNZ official cash rate (2026-Q1)
    CAD: 5.00   # BOC overnight rate (2026-Q1)
    CHF: 1.50   # SNB policy rate (2026-Q1)

# --- Volatility Regime Gate ---
# Inline ATR-percentile regime classifier wired in backtest._compute_regime_label().
# Tested 2026-04-01: IS Sharpe 2.90 but OOS 0.92 (gap 68.3% vs 45.8% without).
# Reason: 2025-2026 compression-breakout setups classified as "low_vol" (blocked incorrectly).
# Verdict: NOT suitable for this intraday momentum strategy. Keep disabled.
regime_filter:
  enabled: false          # Tested — makes IS/OOS gap worse (68.3% vs 45.8%). Do not re-enable.
  block_on: "low_vol"    # Regime label that triggers the gate (high_vol / low_vol)

# --- News Filter ---
news_filter:
  enabled: true
  blackout_minutes: 15        # Minutes before and after event
  impact_levels: ["high"]     # Filter only high-impact events
  calendar_path: "data/economic_calendar.csv"

# --- Risk Management ---
risk:
  reward_ratio: 1.7         # C-ST-09 alignment (2026-04-02): realized RR=1.6989 from backtest export, configured RR aligned to observed execution profile
  partial_exit: false       # tested: WR 63.8% but Sharpe 2.31 vs 3.37 full exit — inferior
  trailing_partial_exit: false  # tested: USDJPY PF 0.84, Sharpe 0.63 — worst result
  slippage_buffer_pips: 0.5 # Added to SL for slippage protection
  max_entry_slippage_pips: 3.0  # P0-02: log WARNING if fill deviates from entry by more than N pips
  # ATR-adaptive SL: SL = sl_atr_multiplier × ATR(14 daily bars) in pips
  # 0 = disabled (uses fixed rr_ratio × min_range_pips = 16 pips)
  # Tested 2026-04-01 at 0.5×: avg_loss=-43 pips, WR=36% (unchanged), Sharpe 0.24 vs 0.90 — INFERIOR
  # Reason: TP=80 pips too wide for 1-hour NYSE session; intraday range~60-80 pips rarely hits 2R target
  # Decoupled SL/TP (tested 2026-04-01): fixed TP=rr²×min_range=32p + ATR SL → INFERIOR
  # When ATR SL > TP (e.g. USDJPY ATR~100p × 0.3 = 30p > ... but TP=32p barely works),
  # order manager rejects trades with R:R < min_rr (1.8). USDJPY 0 trades, EURUSD 25 only.
  sl_atr_multiplier: 0.0
  min_lots: 0.01            # Minimum position size
  max_lots: 10.0            # Maximum position size
  adjust_sl_for_spread: true

  # Circuit breaker: halt all trading after N consecutive session losses
  # WR=44.8% → P(9 consec losses) ≈ 0.3% ≈ 1×/3 years — statistically normal, do not halt
  # Tested 2026-04-01: max observed = 9 consecutive losses in 3-year backtest
  max_consecutive_losses: 10

# --- Web Dashboard ---
dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 8080
  api_token: ""

# --- External Alerting ---
alerting:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  discord:
    enabled: false
    webhook_url: ""
  events:
    - signal_detected
    - trade_executed
    - trade_closed
    - kill_switch
    - ib_disconnected
    - ib_reconnected
    - session_end_open_position
    - session_end_clean
    - daily_summary
